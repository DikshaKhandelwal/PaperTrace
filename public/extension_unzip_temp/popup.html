<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 400px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
    }

    .container {
      padding: 20px;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #3b82f6;
    }

    .subtitle {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 16px;
    }

    .status {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 13px;
      line-height: 1.4;
    }

    .status.loading {
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid #3b82f6;
      color: #60a5fa;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status.loading::before {
      content: "";
      width: 14px;
      height: 14px;
      border-radius: 999px;
      border: 2px solid rgba(96, 165, 250, 0.35);
      border-top-color: #60a5fa;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }

    .status.success {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid #10b981;
      color: #6ee7b7;
    }

    .status.error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid #ef4444;
      color: #fca5a5;
    }

    .button {
      width: 100%;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 8px;
    }

    .button.primary {
      background: #3b82f6;
      color: #0f172a;
    }

    .button.primary:hover:not(:disabled) {
      background: #2563eb;
    }

    .button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .results {
      margin-top: 16px;
      padding: 12px;
      background: rgba(51, 65, 85, 0.3);
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.6;
      max-height: 300px;
      overflow-y: auto;
    }

    .result-item {
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(100, 116, 139, 0.3);
    }

    .result-item:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .signal-name {
      font-weight: 600;
      color: #60a5fa;
      margin-bottom: 4px;
    }

    .signal-score {
      color: #94a3b8;
      font-size: 11px;
    }

    .signal-green {
      color: #6ee7b7;
    }

    .signal-yellow {
      color: #fcd34d;
    }

    .signal-red {
      color: #fca5a5;
    }

    .open-full {
      text-align: center;
    }

    .open-full a {
      color: #3b82f6;
      text-decoration: none;
      font-size: 12px;
    }

    .open-full a:hover {
      text-decoration: underline;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>PaperTrace</h1>
    <p class="subtitle">Paper Integrity Analyzer</p>

    <div id="status" class="status loading" style="display: none;"></div>

    <button class="button primary" id="analyzeBtn">Analyze This Paper</button>
    <button class="button" style="background: #1d4ed8; color: #eff6ff;" id="openAppBtn">
      Open Full App
    </button>
    <button class="button" style="background: #334155; color: #e2e8f0;" id="settingsBtn">
      Settings
    </button>

    <div id="results" class="results" style="display: none;"></div>

    <div id="noResults" style="padding: 20px 0; text-align: center; color: #64748b;">
      <p style="font-size: 12px; line-height: 1.6;">
        Click "Analyze This Paper" to scan the current paper for integrity issues.
      </p>
    </div>

    <div class="open-full">
      <a href="#" id="fullReport">View Full Report →</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
